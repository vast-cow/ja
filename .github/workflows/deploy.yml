name: Deploy AstroPaper to GitHub Pages

on:
  push:
    branches: [posts]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLOG_LANG: ${{ vars.BLOG_LANG }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASTROPAPER_REPOSITORY }}
          ref: ${{ vars.ASTROPAPER_BRANCH }}

      - name: Checkout posts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'posts' }}
          path: content-source
          sparse-checkout: posts/
          sparse-checkout-cone-mode: false

      - name: Replace posts content
        run: |
          rm -rf src/content/posts
          mkdir -p src/content/posts
          cp -a content-source/posts/. src/content/posts/
          rm -rf content-source

      - name: Cache OG image fonts
        if: env.BLOG_LANG == 'ja'
        uses: actions/cache@v4
        with:
          path: .cache/og-fonts
          key: ${{ runner.os }}-og-fonts-${{ hashFiles('scripts/download-og-fonts.sh') }}

      - name: Download OG image fonts
        if: env.BLOG_LANG == 'ja'
        run: bash scripts/download-og-fonts.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure author metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ASTRO_AUTHOR=$(gh api "users/${{ github.repository_owner }}" --jq '.name // .login')" >> "$GITHUB_ENV"
          echo "ASTRO_PROFILE_URL=https://github.com/${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "ASTRO_EDIT_POST_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/edit/${GITHUB_REF}/posts/" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
